[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# dandystay.com (domain alias on this site) — hub page served from /dandystay/
[[redirects]]
  from = "https://dandystay.com/*"
  to = "https://www.dandystay.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.dandystay.com/"
  to = "/dandystay/index.html"
  status = 200
  force = true

[[redirects]]
  from = "https://www.dandystay.com/*"
  to = "/dandystay/:splat"
  status = 200
  force = true

# Returning-guest SMS opt-in — netlify/functions/sms-signup.mjs
[[redirects]]
  from = "/api/sms/*"
  to = "/.netlify/functions/sms-signup/:splat"
  status = 200
  force = true

# Cabin Ops API — served by netlify/functions/ops.mjs
[[redirects]]
  from = "/api/ops/*"
  to = "/.netlify/functions/ops/:splat"
  status = 200
  force = true

[[headers]]
  for = "/ops/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/tickets/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
